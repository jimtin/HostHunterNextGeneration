name: hosthunter-next-generation-test

services:
  coverage:
    image: ${HH_TEST_IMAGE:-hosthunter-next-generation-test:local}
    working_dir: /workspace
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - .:/workspace:ro
      - ./.artifacts:/artifacts
    group_add:
      - "${HH_HOST_GID:-1000}"
    environment:
      HOME: /tmp
      HH_ARTIFACT_ROOT: /artifacts/release-proof
      HH_CANDIDATE_SHA: ${HH_CANDIDATE_SHA:-}
      HH_CANDIDATE_TREE: ${HH_CANDIDATE_TREE:-}
    command:
      - bash
      - scripts/lanes/unit.sh
      - coverage

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: ${HH_TEST_IMAGE:-hosthunter-next-generation-test:local}
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - .:/workspace:ro
      - ./.artifacts:/artifacts
      - ssh-runtime:/run/hosthunter-ssh:ro
    group_add:
      - "10002"
      - "${HH_HOST_GID:-1000}"
    environment:
      HOME: /tmp
      HH_ARTIFACT_ROOT: /artifacts
      HH_SSH_HOST: ssh-target
      HH_SSH_PORT: "22"
      HH_SSH_RUNTIME_DIR: /run/hosthunter-ssh
    networks:
      - test

  ssh-target:
    build:
      context: tests/fixtures/ssh
      dockerfile: Dockerfile
    image: ${HH_SSH_FIXTURE_IMAGE:-hosthunter-next-generation-ssh-fixture:local}
    # The disposable fixture must update /etc/shadow with its run-generated
    # password. It has no host bind mounts and is destroyed after each gate.
    tmpfs:
      - /tmp:mode=1777
      - /run/sshd:mode=0755
      - /home/hhfixture:uid=10001,gid=10001,mode=0700
    volumes:
      - ssh-runtime:/run/hosthunter-ssh
    networks:
      test:
        aliases:
          - ssh-target-alt

networks:
  test:
    internal: true

volumes:
  ssh-runtime:
